name: Build Android APK - Mecha Fighter

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'kivy_app/**'
      - 'buildozer.spec'
      - '.github/workflows/build-apk.yml'

jobs:
  build-with-docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Clean previous builds
      run: |
        rm -rf bin/ .buildozer/ output/ *.log 2>/dev/null || true
        mkdir -p bin .buildozer output

    - name: Build APK using Docker
      run: |
        echo "========================================"
        echo "Building Mecha Fighter APK..."
        echo "========================================"

        docker pull kivy/buildozer:latest || docker pull kivymd/buildozer:stable

        docker run --rm \
          -v $(pwd):/app \
          --privileged \
          -e BUILDOZER_USER_ID=$(id -u) \
          -e BUILDOZER_GROUP_ID=$(id -g) \
          kivy/buildozer:latest \
          bash -c "cd /app && buildozer -v android debug"

        echo "========================================"
        echo "Build complete!"
        echo "========================================"

    - name: List artifacts
      run: |
        echo "=== APK files ==="
        find . -name "*.apk" -ls 2>/dev/null || echo "No APK found"
        echo "=== AAB files ==="
        find . -name "*.aab" -ls 2>/dev/null || echo "No AAB found"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: mecha-fighter-apk
        path: |
          bin/*.apk
          bin/*.aab
        retention-days: 30
        if-no-files-found: warn